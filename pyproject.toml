[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "panadipo"
version = "1.0.0"
description = "PanAdipo: AI-enabled echocardiography for prominent epicardial adiposity (training, inference, and statistical analysis code)"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
# versions used for the manuscript (Supplemental Methods)
dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.3.3",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "lifelines>=0.30.3",
    "scikit-learn>=1.8.0",
    "pyyaml",
]

[project.optional-dependencies]
# model training, inference, and Grad-CAM++ (PyTorch 2.7.1, grad-cam 1.5.5)
dl = ["torch>=2.7.1", "opencv-python", "grad-cam>=1.5.5"]
test = ["pytest"]

[tool.setuptools]
packages = ["panadipo"]

[tool.setuptools.package-data]
panadipo = ["fine_gray.R"]

[tool.ruff]
line-length = 120
